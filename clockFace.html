<!--
================================================================================
  clockFace.html — Analog Clock Face  (v0.3)
================================================================================

  PURPOSE
  -------
  A self-contained analog clock face for embedding in presentation slides.
  Transparent background by default so it floats cleanly on any slide.

  DESIGN
  ------
  Minimal Apple Watch-inspired face: 12 hour markers (no numerals, no ring),
  hour, minute, and seconds hands. Strokes are weighted to stay legible when
  the face is displayed as small as 100x100. Smooth sweep animation via
  requestAnimationFrame, capped at ~30fps and paused whenever the tab/slide
  is off-screen so several faces can share a deck without burning cycles.

  URL PARAMETERS
  --------------
  ?darkmode=yes      Light-colored hands and markers for dark slide backgrounds.
                     Also accepted: ?darkmode=true.
  ?secondHand=false  Hide the sweeping second hand and its red center dot.
                     Also accepted: ?secondHand=no / ?secondHand=0.

  EMBEDDING
  ---------
  <iframe src="clockFace.html" width="160" height="160" frameborder="0"
          style="background:transparent;" allowtransparency="true"></iframe>

  Recommended size: 100–200 px square. Keep it square — the face is circular.
================================================================================
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Clock Face</title>
  <style>
    :root {
      --hand-color:   #1c1c1e;
      --marker-color: #1c1c1e;
      --second-color: #e5334b;
    }

    body.dark-mode {
      --hand-color:   #f5f5f7;
      --marker-color: #f5f5f7;
      --second-color: #ff6b6b;
    }

    body {
      margin: 0;
      background: transparent;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    svg {
      width: 90vmin;
      height: 90vmin;
      max-width: 90vh;
      max-height: 90vw;
      overflow: visible;
    }
  </style>
</head>
<body>
  <svg id="clock-face" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">

    <!-- Hour markers (generated by JS) -->
    <g id="markers"></g>

    <!-- Hands (pointing to 12 when unrotated; rotated by JS) -->
    <line id="hand-hour"
          x1="100" y1="112" x2="100" y2="48"
          stroke="var(--hand-color)" stroke-width="5.5" stroke-linecap="round" />

    <line id="hand-minute"
          x1="100" y1="112" x2="100" y2="26"
          stroke="var(--hand-color)" stroke-width="4" stroke-linecap="round" />

    <line id="hand-second"
          x1="100" y1="122" x2="100" y2="22"
          stroke="var(--second-color)" stroke-width="2" stroke-linecap="round" />

    <!-- Center cap -->
    <circle cx="100" cy="100" r="5.5" fill="var(--hand-color)" />
    <circle id="center-dot" cx="100" cy="100" r="3" fill="var(--second-color)" />

    <!-- Version -->
    <text x="100" y="140" text-anchor="middle"
          font-family="system-ui, sans-serif" font-size="6"
          fill="var(--marker-color)" opacity="0.3">v0.3</text>

  </svg>

  <script>
    (function () {
      // --- URL parameters ---
      let showSeconds = true;
      try {
        const p = new URLSearchParams(window.location.search);
        if (["yes", "true"].includes((p.get("darkmode") || "").toLowerCase())) {
          document.body.classList.add("dark-mode");
        }
        if (["false", "no", "0"].includes((p.get("secondHand") || "").toLowerCase())) {
          showSeconds = false;
        }
      } catch (e) {}

      // --- Hour markers ---
      const markersG = document.getElementById("markers");
      for (let i = 0; i < 12; i++) {
        const angle = i * 30;
        const rad   = angle * Math.PI / 180;
        const major = i % 3 === 0;
        const outer = 88;
        const inner = major ? 75 : 82;

        const x1 = 100 + outer * Math.sin(rad);
        const y1 = 100 - outer * Math.cos(rad);
        const x2 = 100 + inner * Math.sin(rad);
        const y2 = 100 - inner * Math.cos(rad);

        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("x1", x1.toFixed(3));
        line.setAttribute("y1", y1.toFixed(3));
        line.setAttribute("x2", x2.toFixed(3));
        line.setAttribute("y2", y2.toFixed(3));
        line.setAttribute("stroke", "var(--marker-color)");
        line.setAttribute("stroke-width", major ? "3.5" : "2");
        line.setAttribute("stroke-linecap", "round");
        markersG.appendChild(line);
      }

      // --- Animation ---
      const hourHand   = document.getElementById("hand-hour");
      const minuteHand = document.getElementById("hand-minute");
      const secondHand = document.getElementById("hand-second");
      const centerDot  = document.getElementById("center-dot");

      if (!showSeconds) {
        secondHand.style.display = "none";
        centerDot.style.display  = "none";
      }

      function rotate(el, deg) {
        el.setAttribute("transform", `rotate(${deg.toFixed(4)}, 100, 100)`);
      }

      function render() {
        const now = new Date();
        const h  = now.getHours() % 12;
        const m  = now.getMinutes();
        const s  = now.getSeconds();
        const ms = now.getMilliseconds();

        const minAngle  = (m + (s + ms / 1000) / 60) * 6;
        const hourAngle = (h + m / 60 + s / 3600) * 30;

        rotate(hourHand,   hourAngle);
        rotate(minuteHand, minAngle);

        if (showSeconds) {
          rotate(secondHand, (s + ms / 1000) * 6);
        }
      }

      // Cap redraws at ~30fps — still a smooth sweep, but half the work of an
      // unthrottled rAF loop and noticeably kinder when several faces share
      // a slide. With no second hand, once a second is plenty.
      const FRAME_MS = showSeconds ? 1000 / 30 : 1000;
      let rafId = null;
      let lastFrame = 0;

      function tick(ts) {
        rafId = requestAnimationFrame(tick);
        if (ts - lastFrame < FRAME_MS) return;
        lastFrame = ts;
        render();
      }

      function start() {
        if (rafId === null) {
          lastFrame = 0;
          rafId = requestAnimationFrame(tick);
        }
      }

      function stop() {
        if (rafId !== null) {
          cancelAnimationFrame(rafId);
          rafId = null;
        }
      }

      // Pause entirely when the tab or slide is off-screen; snap to the
      // correct time and resume the instant it returns.
      document.addEventListener("visibilitychange", function () {
        if (document.hidden) {
          stop();
        } else {
          render();
          start();
        }
      });

      render();
      start();
    })();
  </script>
</body>
</html>
