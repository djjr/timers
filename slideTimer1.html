<!--
================================================================================
  slideTimer1.html — Presentation Countdown Timer  (v0.5)
================================================================================

  PURPOSE
  -------
  A self-contained countdown timer designed to be embedded as an <iframe>
  inside presentation slides (reveal.js, slides.com, etc.). Transparent
  background by default so it sits cleanly on any slide.

  LAYOUT (5 rows)
  ---------------
  Row 1 — Controls     : [ Start ]  [ Pause ]  [ Stop ]
  Row 2 — Countdown    : large MM:SS display; turns red with "+" prefix in overtime
  Row 3 — Presentation : cumulative running total for the session  [ Reset ]
  Row 4 — World        : current local wall-clock time (24 h, HH:MM)
  Row 5 — Minutes      : editable duration input (only when stopped)

  FEATURES
  --------
  • Countdown        Counts down from the set duration. Uses performance.now()
                     delta-time so accuracy is unaffected by interval jitter.

  • Overtime         When the countdown reaches 0:00 the timer keeps running,
                     switching to an upward count displayed in red with a "+"
                     prefix (e.g. +1:23). A three-tone chime plays at zero.

  • Audio cues       A short tick plays each of the last 5 seconds before zero.
                     A three-note chime plays at zero. Uses the Web Audio API
                     (no audio files required). Audio requires a prior user
                     gesture in most browsers; it will be silent on auto-start
                     until the user interacts with the page.

  • Presentation     Running total of all time spent with this timer active
    total            (across multiple countdown runs on the same slide).
                     Persists across slides via localStorage when a deckID is
                     provided (see URL PARAMETERS below). Resets on page load
                     if no deckID is set. Two-click confirmation required to
                     reset manually.

  • World clock      Live local wall-clock time in 24-hour HH:MM format.
                     The display shows hours and minutes only, so it visually
                     updates once per minute.

  • Transparent bg   Default background is transparent so slide backgrounds
                     show through. Use ?darkmode=yes for light-colored text
                     on dark slide backgrounds.

  URL PARAMETERS
  --------------
  ?t=N              Set the initial countdown duration in minutes.
                    Default: 5.  Fractional values are supported.
                    Examples: ?t=3  ?t=1.5 (90 seconds)  ?t=0.5 (30 seconds)

  ?wait=true        Load the timer in a stopped/ready state instead of
                    auto-starting. Useful when you want to start manually.

  ?deckID=slug      Enables cross-slide presentation total. All timer iframes
                    that share the same deckID read and write the same
                    localStorage key, so the cumulative total persists as the
                    presenter moves between slides.

                    For local reveal.js on the same origin the deckID is
                    inferred automatically from the parent page's URL path,
                    so no parameter is needed.

                    For slides.com or other cross-origin hosts, pass the deck
                    slug explicitly:
                      ?deckID=my-deck-name

                    Without a deckID the total is in-memory only and isolated
                    from all other tabs — safe to run alongside other timers.

  ?darkmode=yes     Apply light-colored text and button styles for use on
                    dark slide backgrounds. Also accepted: ?darkmode=true.

  Parameters can be combined:
    slideTimer1.html?t=3&deckID=cs101-lecture&darkmode=yes&wait=true

  EMBEDDING
  ---------
  Minimal iframe embed (auto-starts, 5-minute countdown):
    <iframe src="slideTimer1.html" width="160" height="130" frameborder="0"></iframe>

  Full example with all options:
    <iframe src="slideTimer1.html?t=3&deckID=cs101&darkmode=yes&wait=true"
            width="160" height="130" frameborder="0"
            style="background:transparent;" allowtransparency="true">
    </iframe>

  Recommended iframe size: 150–180 px wide × 120–140 px tall.

  JAVASCRIPT API
  --------------
  The following functions are exposed on the iframe's window object for
  optional external control from the parent page (same-origin only):

    iframe.contentWindow.startTimer()        — Start or resume the timer
    iframe.contentWindow.resetGlobalTotal()  — Trigger the reset flow

  CROSS-SLIDE TOTAL BEHAVIOUR
  ---------------------------
  When a deckID is set:
  • The total is loaded from localStorage on page load (key:
    "presentationTotalMs_<deckID>"), so navigating between slides preserves it.
  • The total is saved to localStorage on every tick (~1 s throttle), on
    pause/stop, and on page unload.
  • A storage event listener keeps multiple iframes on the same slide in sync.
  • Two tabs open to the same deckID will share (not double-count) the total,
    since storage events overwrite each frame's local value with the latest save.

  BROWSER NOTES
  -------------
  • Tested in Chrome/Safari/Firefox on macOS.
  • Audio may be silent until first user interaction (browser autoplay policy).
  • Background transparency requires allowtransparency="true" on the iframe
    in some older embedding contexts.
================================================================================
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Countdown Timer</title>
  <style>
    body {
      margin: 0;
      background: transparent;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .countdown-timer {
      position: relative;
      padding: 0.5rem 0.75rem;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 0.35rem;
      user-select: none;
    }

    .countdown-time-display {
      font-size: 2rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      min-width: 5ch;
      text-align: center;
      margin-bottom: 0.1rem;
    }

    .countdown-total-row {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .countdown-total-display {
      font-size: 0.7rem;
      opacity: 0.8;
      min-width: 8ch;
      text-align: center;
    }

    .countdown-world-clock {
      font-size: 0.7rem;
      opacity: 0.8;
      text-align: center;
    }

    .countdown-reset-total {
      font-size: 0.55rem;
      padding: 0.15rem 0.3rem;
      border: 1px solid #ccc;
      background: #fafafa;
      border-radius: 3px;
      cursor: pointer;
      opacity: 0.7;
      transition: opacity 0.15s;
    }

    .countdown-reset-total:hover {
      opacity: 1;
      background: #f0f0f0;
    }

    .countdown-reset-total.confirm {
      background: #fee;
      border-color: #c66;
      color: #900;
      opacity: 1;
    }

    .countdown-controls {
      display: flex;
      gap: 0.25rem;
    }

    .countdown-controls button {
      font-size: 0.7rem;
      padding: 0.2rem 0.4rem;
      border: 1px solid #aaa;
      background: #f4f4f4;
      border-radius: 3px;
      cursor: pointer;
    }

    .countdown-controls button:hover:not(:disabled) {
      background: #e4e4e4;
    }

    .countdown-controls button:disabled {
      opacity: 0.45;
      cursor: default;
    }

    .countdown-settings {
      font-size: 0.65rem;
      opacity: 0.8;
      display: flex;
      gap: 0.25rem;
      align-items: center;
    }

    .countdown-settings input {
      width: 2.5rem;
      font-size: 0.7rem;
      padding: 0.1rem;
    }

    /* pulse animation */
    .countdown-pulse {
      animation: countdown-pulse 0.25s ease-out;
    }

    @keyframes countdown-pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.07); }
      100% { transform: scale(1); }
    }

    /* overtime state */
    .countdown-time-display.overtime {
      color: #c00;
    }

    /* version label */
    .countdown-version {
      position: absolute;
      bottom: 2px;
      right: 4px;
      font-size: 0.5rem;
      opacity: 0.5;
      pointer-events: none;
    }

    /* dark mode: light colors for dark slide backgrounds (?darkmode=yes) */
    .countdown-timer.dark-mode {
      color: #f0f0f0;
    }

    .countdown-timer.dark-mode .countdown-controls button {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.3);
      color: #f0f0f0;
    }

    .countdown-timer.dark-mode .countdown-controls button:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.22);
    }

    .countdown-timer.dark-mode .countdown-reset-total {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.2);
      color: #f0f0f0;
    }

    .countdown-timer.dark-mode .countdown-reset-total:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    .countdown-timer.dark-mode .countdown-reset-total.confirm {
      background: rgba(255, 80, 80, 0.25);
      border-color: rgba(255, 80, 80, 0.6);
      color: #ffaaaa;
    }

    .countdown-timer.dark-mode .countdown-settings input {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #f0f0f0;
      color-scheme: dark;
    }

    .countdown-timer.dark-mode .countdown-time-display.overtime {
      color: #ff7070;
    }
  </style>
</head>

<body>
  <div class="countdown-timer" id="countdown-timer">
    <div class="countdown-controls">
      <button id="countdown-start">Start</button>
      <button id="countdown-pause" disabled>Pause</button>
      <button id="countdown-stop" disabled>Stop</button>
    </div>

    <div class="countdown-time-display" id="countdown-display">05:00</div>

    <div class="countdown-total-row">
      <div class="countdown-total-display" id="countdown-total">Presentation: 00:00</div>
      <button class="countdown-reset-total" id="countdown-reset-total" title="Reset cumulative total">Reset</button>
    </div>

    <div class="countdown-world-clock" id="countdown-world-clock">World: 00:00</div>

    <div class="countdown-settings">
      <span>Minutes:</span>
      <input type="number" id="countdown-minutes" min="0" value="5" />
    </div>

    <div class="countdown-version">v0.5</div>
  </div>

  <script>
    (function () {
      const timerEl = document.getElementById("countdown-timer");
      const displayEl = document.getElementById("countdown-display");
      const totalEl = document.getElementById("countdown-total");
      const worldClockEl = document.getElementById("countdown-world-clock");
      const resetTotalBtn = document.getElementById("countdown-reset-total");
      const startBtn = document.getElementById("countdown-start");
      const pauseBtn = document.getElementById("countdown-pause");
      const stopBtn = document.getElementById("countdown-stop");
      const minutesInput = document.getElementById("countdown-minutes");

      // --- URL parameters: t, wait, deckID ---
      let initialMinutes = 5;
      let autoStartOnLoad = true;
      let deckId = null;

      try {
        const params = new URLSearchParams(window.location.search);

        const tParam = params.get("t");
        if (tParam !== null) {
          const parsed = Number(tParam);
          if (!isNaN(parsed) && parsed >= 0) initialMinutes = parsed;
        }

        if ((params.get("wait") || "").toLowerCase() === "true") autoStartOnLoad = false;

        deckId = params.get("deckID") || null;

        if (["yes", "true"].includes((params.get("darkmode") || "").toLowerCase())) {
          timerEl.classList.add("dark-mode");
        }
      } catch (e) {}

      // Fallback: derive deckID from same-origin parent pathname (local reveal.js).
      // Blocked cross-origin (e.g. slides.com iframes) — pass ?deckID= explicitly there.
      if (!deckId) {
        try {
          if (window.parent !== window) deckId = window.parent.location.pathname || null;
        } catch (e) {}
      }

      // --- Global total ---
      // Persisted via localStorage when a deckID is known (enables cross-slide totals).
      // In-memory only otherwise — prevents contamination from unrelated timer tabs.
      const STORAGE_KEY = deckId ? "presentationTotalMs_" + deckId : null;
      let globalTotalMs = 0;

      if (STORAGE_KEY) {
        try {
          const stored = localStorage.getItem(STORAGE_KEY);
          if (stored !== null) {
            const parsed = Number(stored);
            if (!isNaN(parsed) && parsed >= 0) globalTotalMs = parsed;
          }
        } catch (e) {}
      }

      function updateTotalDisplay() {
        totalEl.textContent = "Presentation: " + formatTime(globalTotalMs);
      }

      function updateWorldClock() {
        const now = new Date();
        const h = now.getHours().toString().padStart(2, "0");
        const m = now.getMinutes().toString().padStart(2, "0");
        worldClockEl.textContent = "World: " + h + ":" + m;
      }

      let lastGlobalSave = performance.now();
      function saveGlobalTotal(force = false) {
        if (!STORAGE_KEY) return;
        const now = performance.now();
        if (!force && now - lastGlobalSave < 1000) return;
        lastGlobalSave = now;
        try {
          localStorage.setItem(STORAGE_KEY, String(Math.round(globalTotalMs)));
        } catch (e) {}
      }

      if (STORAGE_KEY) {
        window.addEventListener("storage", (e) => {
          if (e.key === STORAGE_KEY) {
            const newValue = Number(e.newValue);
            if (!isNaN(newValue) && newValue >= 0) {
              globalTotalMs = newValue;
              updateTotalDisplay();
            }
          }
        });
      }

      // ---- Reset global total with confirmation ----
      let resetConfirmPending = false;
      let resetConfirmTimeout = null;

      function resetGlobalTotal() {
        if (!resetConfirmPending) {
          resetConfirmPending = true;
          resetTotalBtn.textContent = "Confirm?";
          resetTotalBtn.classList.add("confirm");
          resetConfirmTimeout = setTimeout(cancelResetConfirm, 3000);
        } else {
          clearTimeout(resetConfirmTimeout);
          globalTotalMs = 0;
          saveGlobalTotal(true);
          updateTotalDisplay();
          cancelResetConfirm();
        }
      }

      function cancelResetConfirm() {
        resetConfirmPending = false;
        resetTotalBtn.textContent = "Reset";
        resetTotalBtn.classList.remove("confirm");
        if (resetConfirmTimeout) {
          clearTimeout(resetConfirmTimeout);
          resetConfirmTimeout = null;
        }
      }

      minutesInput.value = initialMinutes;

      let totalDurationMs = initialMinutes * 60 * 1000;
      let remainingMs = totalDurationMs;

      // countdown vs overtime
      let phase = "countdown"; // "countdown" | "overtime"
      let elapsedMs = 0;       // used in overtime

      let timerId = null;
      let lastTimestamp = null;
      let state = "stopped";   // "stopped" | "running" | "paused"
      let lastTickSecond = null;
      let audioCtx = null;

      function initDurationFromInput() {
        const mins = Math.max(0, Number(minutesInput.value) || 0);
        totalDurationMs = mins * 60 * 1000;
        remainingMs = totalDurationMs;
        elapsedMs = 0;
        phase = "countdown";
        displayEl.classList.remove("overtime");
        updateDisplay(remainingMs);
      }

      function formatTime(ms) {
        const totalSeconds = Math.max(0, Math.ceil(ms / 1000));
        const minutes = Math.floor(totalSeconds / 60);
        const seconds = totalSeconds % 60;
        return `${minutes}:${seconds.toString().padStart(2, "0")}`;
      }

      function updateDisplay(ms) {
        displayEl.textContent = formatTime(ms);
      }

      function getAudioContext() {
        if (!audioCtx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return null;
          audioCtx = new AC();
        }
        if (audioCtx.state === "suspended") {
          audioCtx.resume();
        }
        return audioCtx;
      }

      function beep(frequency, durationMs, volume, type = "sine") {
        const ctx = getAudioContext();
        if (!ctx) return;

        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = type;
        osc.frequency.value = frequency;

        osc.connect(gain);
        gain.connect(ctx.destination);

        gain.gain.value = volume;
        osc.start();

        const now = ctx.currentTime;
        gain.gain.setValueAtTime(volume, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + durationMs / 1000);

        osc.stop(now + durationMs / 1000 + 0.05);
      }

      function playTick() {
        beep(1200, 60, 0.1, "square");
        displayEl.classList.remove("countdown-pulse");
        void displayEl.offsetWidth;
        displayEl.classList.add("countdown-pulse");
      }

      function playEndRing() {
        const pattern = [
          { delay: 0, freq: 880 },
          { delay: 0.15, freq: 1200 },
          { delay: 0.3, freq: 1000 }
        ];
        pattern.forEach(step => {
          setTimeout(() => beep(step.freq, 180, 0.2, "sine"), step.delay * 1000);
        });
      }

      function setControlsForState() {
        startBtn.disabled = state === "running";
        pauseBtn.disabled = state !== "running";
        stopBtn.disabled = state === "stopped";
        minutesInput.disabled = state !== "stopped";
      }

      function startTimer() {
        if (state === "stopped") initDurationFromInput();
        if (remainingMs <= 0 && phase === "countdown") {
          remainingMs = totalDurationMs;
        }

        state = "running";
        lastTimestamp = performance.now();
        lastTickSecond = null;

        if (timerId !== null) clearInterval(timerId);
        timerId = setInterval(tick, 50);

        setControlsForState();
      }

      function pauseTimer() {
        if (state !== "running") return;
        state = "paused";
        clearInterval(timerId);
        timerId = null;
        saveGlobalTotal(true);
        updateTotalDisplay();
        setControlsForState();
      }

      function stopTimer() {
        clearInterval(timerId);
        timerId = null;
        state = "stopped";
        initDurationFromInput();
        lastTickSecond = null;
        saveGlobalTotal(true);
        updateTotalDisplay();
        setControlsForState();
      }

      function tick() {
        const now = performance.now();
        const dt = now - lastTimestamp;
        lastTimestamp = now;

        // --- Global total: accumulate whenever we're running ---
        if (state === "running") {
          globalTotalMs += dt;
          updateTotalDisplay();
          saveGlobalTotal(false);
        }

        // --- Local slide timer logic ---
        if (phase === "countdown") {
          remainingMs -= dt;

          if (remainingMs <= 0) {
            remainingMs = 0;
            updateDisplay(remainingMs);
            playEndRing();

            // switch to overtime: start counting UP from the original duration
            phase = "overtime";
            elapsedMs = totalDurationMs;
            displayEl.classList.add("overtime");
            lastTickSecond = null;
            return;
          }

          updateDisplay(remainingMs);

          if (remainingMs <= 5000) {
            const sec = Math.ceil(remainingMs / 1000);
            if (sec !== lastTickSecond) {
              lastTickSecond = sec;
              playTick();
            }
          }
        } else if (phase === "overtime") {
          elapsedMs += dt;
          displayEl.textContent = "+" + formatTime(elapsedMs);
        }
      }

      startBtn.addEventListener("click", startTimer);
      pauseBtn.addEventListener("click", pauseTimer);
      stopBtn.addEventListener("click", stopTimer);
      resetTotalBtn.addEventListener("click", resetGlobalTotal);

      minutesInput.addEventListener("change", () => {
        if (state === "stopped") initDurationFromInput();
      });

      // Initial UI setup
      initDurationFromInput();
      setControlsForState();
      updateTotalDisplay();
      updateWorldClock();
      setInterval(updateWorldClock, 1000);

      // Auto-start logic
      if (autoStartOnLoad && totalDurationMs > 0) {
        window.requestAnimationFrame(startTimer);
      }

      // Optionally expose functions for external control
      window.startTimer = startTimer;
      window.resetGlobalTotal = resetGlobalTotal;

      window.addEventListener("beforeunload", () => saveGlobalTotal(true));
    })();
  </script>
</body>
</html>
